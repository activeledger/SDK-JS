name: Publish packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 2.0.1). Leave blank to publish whatever's currently committed in package.json."
        required: false

permissions:
  # contents: write, not read - the last step creates the GitHub release for
  # the tag. Without it the tag exists and the packages publish, but nothing
  # appears under Releases, which is how v2.0.2 and v2.1.0 shipped with no
  # release entry at all.
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # secrets can't be referenced directly in a step's `if:` - the
    # "secrets" context isn't in the allowed-contexts list for
    # expressions there. Routing it through env: first works around that -
    # env: is an allowed context in `if:`. (This exact mistake broke the
    # main activeledger repo's own publish workflow entirely the first
    # time around - every push, tag or not, failed immediately with 0
    # jobs run, since GitHub refuses to even register a workflow file
    # that fails schema validation.)
    env:
      NPM_TOKEN_SET: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@activeledger"

      # Plain npm workspaces (not lerna bootstrap) - npm ci already sets up
      # the packages/* symlinks since root package.json declares
      # "workspaces": ["packages/*"].
      - name: Install dependencies
        run: npm ci

      # A pushed tag is the source of truth for what gets published, same
      # reasoning as the main activeledger repo's workflow. Runs before the
      # build so nothing built downstream is stale relative to the version
      # actually published. workflow_dispatch's optional version input
      # covers a manual republish of an arbitrary version without needing a
      # new tag.
      # scripts/set-version.mjs replaces `lerna version`. It does the same
      # three things - root version, every package version, and every
      # dependency range pointing at a sibling rewritten to the exact
      # version - and the third is the one that is easy to forget and
      # impossible to notice: npm will happily publish sdk-node depending on
      # an older sdk-core, and it installs cleanly.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Set version from workflow input
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: node scripts/set-version.mjs "${{ inputs.version }}"

      - name: Build all packages
        run: npm run build

      - name: Publish to GitHub Packages
        run: npm publish --workspaces --access public --registry https://npm.pkg.github.com/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Re-runs setup-node pointed at npmjs.org - it (re)writes the auth
      # line in ~/.npmrc for whichever registry-url you give it, so this
      # has to happen as its own step, after the GitHub Packages publish
      # above has already finished with it, not before.
      #
      # Guarded on the NPM_TOKEN secret actually being set - add it in the
      # repo's Settings -> Secrets and Actions to turn this on. Skipping
      # cleanly here (rather than failing) means GitHub Packages keeps
      # publishing normally in the meantime.
      - name: Setup Node (npmjs.org)
        if: ${{ env.NPM_TOKEN_SET == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          scope: "@activeledger"

      # --access public explicitly, plus NPM_CONFIG_ACCESS as a belt and
      # braces. A scoped package defaults to restricted, and these names'
      # first-ever publish failed with "E402 You must sign up for private
      # packages" because of it. The flag alone is enough now lerna (which
      # had no --access flag, only the differently-named
      # --verify-access) is out of the chain, but the env var costs nothing
      # and is what actually fixed it the first time.
      - name: Publish to npmjs.org
        if: ${{ env.NPM_TOKEN_SET == 'true' }}
        run: npm publish --workspaces --access public --registry https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_ACCESS: public

      # The tag on its own leaves nothing under Releases. Same approach as the
      # main activeledger repo's publish workflow. Tolerates an existing
      # release so a manual re-run of a published version is not an error.
      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists - leaving it alone"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
