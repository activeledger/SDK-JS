# Cuts a release: bump -> commit -> tag -> push -> publish.
#
# The publish is CALLED from here rather than left to fire on the tag this
# workflow pushes. GitHub does not start new workflow runs from events created
# with the default GITHUB_TOKEN, so publish.yml's `on: push: tags` never sees
# it. A workflow_call runs inside this run, so the restriction does not apply
# and one dispatch does the whole release.
#
# This exists because the order matters and cannot be fixed inside
# publish.yml. That workflow triggers ON a tag, so by the time it runs the tag
# already points at a commit whose package.json files still hold the previous
# version. It bumped them in the runner and never pushed, so the published
# tarballs were correct while the tag and the source tree were not: every
# manifest in this repository read 2.0.0 while npm correctly served 2.1.0, and
# a checkout could not tell you what the current release was.
#
# Bumping BEFORE the tag is what makes the source tree, the tag and the
# published tarball all report the same number.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 2.1.1)"
        required: true

permissions:
  # packages: write as well as contents: write - the called publish workflow
  # inherits this job's permissions, not the ones declared in its own file,
  # and it pushes to GitHub Packages.
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          # Full history: the tag has to be created on a real commit rather
          # than a shallow stub.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace
        run: npm ci

      - name: Refuse a version that already exists
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::tag v${{ inputs.version }} already exists - pick a new version"
            exit 1
          fi

      # Nothing is published from a tree that does not pass. The release
      # workflow is the last place a broken build should be able to get out,
      # and this repository had no test workflow at all until recently.
      - name: Test
        run: npm test

      # Every package moves together even when git says it is unchanged -
      # these are released as a set. The script also rewrites each package's
      # dependencies on its siblings to the same exact version, so a published
      # sdk-node depends on the sdk-core it was built against rather than on
      # whatever a range resolves to later.
      - name: Bump every package
        run: node scripts/set-version.mjs "${{ inputs.version }}"

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${{ inputs.version }}"
          git tag -a "v${{ inputs.version }}" -m "v${{ inputs.version }}"
          # master first: if branch protection rejects it, the tag is never
          # pushed and no half-release is published. A tag pointing at a commit
          # that is not on master is worse than no tag at all.
          git push origin master
          git push origin "v${{ inputs.version }}"

      - name: Summary
        run: |
          echo "Tagged v${{ inputs.version }}. Publishing follows in this same run." >> "$GITHUB_STEP_SUMMARY"
          echo "The commit, the tag and the published packages all report ${{ inputs.version }}." >> "$GITHUB_STEP_SUMMARY"

  # Same run, so no GITHUB_TOKEN trigger restriction to work around.
  publish:
    needs: release
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ inputs.version }}
    # NPM_TOKEN, and whatever else publish.yml reaches for
    secrets: inherit
